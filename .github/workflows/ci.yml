name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: University alias reconcile
        run: node scripts/reconcile-university-aliases.mjs --check

      - name: University catalog validation
        run: node scripts/validate-university-catalog.mjs

      - name: Regenerate university seed and check drift
        run: |
          node scripts/generate-university-seed.mjs
          git diff --exit-code -- shared/data/university-alias-seed-2026.json

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check for conflict markers
        run: |
          if git grep -n '^<<<<<<< ' -- . ':!node_modules'; then
            echo "Conflict markers found in tracked files."
            exit 1
          fi

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema migration
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:54322/postgres
        run: bash scripts/ci-prepare-database.sh

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:54322/postgres
        run: npm run test:db
