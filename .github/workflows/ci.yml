name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: University alias reconcile
        run: node scripts/reconcile-university-aliases.mjs --check

      - name: University catalog validation
        run: node scripts/validate-university-catalog.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Check for conflict markers / whitespace errors
        run: git diff --check
