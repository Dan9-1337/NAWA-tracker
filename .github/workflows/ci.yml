name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Database tests on PGlite (migrations, pgTAP-style SQL tests, seed)
        run: npm run test:db:pglite

      - name: University catalog validation
        run: node scripts/validate-university-catalog.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Check for conflict markers
        run: |
          if git grep -n '^<<<<<<< ' -- . ':!node_modules'; then
            echo "Conflict markers found in tracked files."
            exit 1
          fi

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema migration
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:54322/postgres
        run: bash scripts/ci-prepare-database.sh

      - name: Run database tests
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:54322/postgres
        run: npm run test:db
