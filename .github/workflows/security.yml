name: Security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: new advisories appear without any code change.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The binary image is used directly: the gitleaks GitHub Action needs a paid licence for organisations.
      - name: Scan history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  dependencies:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Audit production dependencies
        run: npm run audit:prod
